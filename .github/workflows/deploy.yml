name: Deploy to Production

on:
  push:
    branches: [ "main"] # Включаем обе на переходный период
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Update Code and .env
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          git pull origin ${{ github.ref_name }}
          cat <<EOF > .env
          DEBUG=False
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ vars.REDIS_PORT || '6379' }}
          DJANGO_LOG_LEVEL=${{ vars.DJANGO_LOG_LEVEL || 'INFO' }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          EOF

    - name: 2. Restart Containers
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          docker compose up -d --build

    - name: 3. Verify Makemigrations
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          OUT=$(docker compose exec web python max_project/manage.py makemigrations max_sessions)
          echo "$OUT"
          if [[ "$OUT" != *"No changes detected"* ]]; then
            echo "ERROR: Uncommitted changes found!"
            exit 1
          fi

    - name: 4. Run Migrations
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          OUT=$(docker compose exec web python max_project/manage.py migrate)
          echo "$OUT"
          if [[ "$OUT" != *"Operations to perform"* ]] && [[ "$OUT" != *"No migrations"* ]]; then
            echo "ERROR: Migration failed!"
            exit 1
          fi

    - name: 5. Collect Static
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          OUT=$(docker compose exec web python max_project/manage.py collectstatic --noinput)
          echo "$OUT"
          if [[ "$OUT" != *"static files copied"* ]] && [[ "$OUT" != *"unmodified"* ]]; then
            echo "ERROR: Collectstatic failed!"
            exit 1
          fi
