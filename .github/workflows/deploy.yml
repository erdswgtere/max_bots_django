name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    # 1. Создаем .env файл из секретов GitHub
    - name: Create .env file
      run: |
        echo "DEBUG=False" >> .env
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
        echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
        echo "DB_USER=${{ secrets.DB_USER }}" >> .env
        echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
        echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
        echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
        echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
        echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env
      
    # 2. Собираем и запускаем через Docker Compose
    # Примечание: В реальном продакшене вы бы деплоили образы в Registry (Docker Hub)
    # или использовали SSH для деплоя на сервер.
    # Здесь пример сборки и проверки запуска.
    
    - name: Build Docker images
      run: docker-compose build

    - name: Test Docker configuration
      run: docker-compose config
      
