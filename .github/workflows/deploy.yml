name: Deploy to Production

on:
  push:
    branches: [ "main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Update Code and .env
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          # 0. Настройка SSH для работы с GitHub через 443 порт (если нужно)
          mkdir -p ~/.ssh
          if ! grep -q "ssh.github.com" ~/.ssh/config 2>/dev/null; then
            echo -e "Host github.com\n  Hostname ssh.github.com\n  Port 443\n  User git" >> ~/.ssh/config
            chmod 600 ~/.ssh/config
          fi
          
          # 1. Если папки нет - клонируем (используем SSH через 443 порт)
          if [ ! -d "${{ secrets.DEPLOY_PATH }}" ]; then
            echo ">>> Folder not found. Cloning repository..."
            # Добавляем GitHub в known_hosts, чтобы избежать "Host key verification failed"
            ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts 2>/dev/null
            git clone git@github.com:${{ github.repository }}.git ${{ secrets.DEPLOY_PATH }}
          fi
          
          cd ${{ secrets.DEPLOY_PATH }}
          
          echo ">>> Updating code..."
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}
          
          echo ">>> Syncing .env..."
          cat <<EOF > .env
          DEBUG=False
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          REDIS_HOST=${{ vars.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
          DJANGO_LOG_LEVEL=${{ vars.DJANGO_LOG_LEVEL || 'INFO' }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          EOF

    - name: 2. Restart Containers
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          docker compose up -d --build

    - name: 3. Verify Makemigrations
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          OUT=$(docker compose exec web python max_project/manage.py makemigrations max_sessions)
          echo "$OUT"
          if [[ "$OUT" != *"No changes detected"* ]]; then
            echo "ERROR: Uncommitted changes found!"
            exit 1
          fi

    - name: 4. Run Migrations
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          OUT=$(docker compose exec web python max_project/manage.py migrate)
          echo "$OUT"
          if [[ "$OUT" != *"Operations to perform"* ]] && [[ "$OUT" != *"No migrations"* ]]; then
            echo "ERROR: Migration failed!"
            exit 1
          fi

    - name: 5. Collect Static
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          OUT=$(docker compose exec web python max_project/manage.py collectstatic --noinput)
          echo "$OUT"
          if [[ "$OUT" != *"static files copied"* ]] && [[ "$OUT" != *"unmodified"* ]]; then
            echo "ERROR: Collectstatic failed!"
            exit 1
          fi

    - name: 6. Create Superuser
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          # Создаем суперпользователя, если он еще не создан.
          # Используем переменные окружения для автоматизации.
          docker compose exec -e DJANGO_SUPERUSER_PASSWORD="${{ secrets.SUPERUSER_PASSWORD }}" web \
            python max_project/manage.py createsuperuser \
            --no-input \
            --username "${{ secrets.SUPERUSER_USERNAME }}" \
            --email "${{ secrets.SUPERUSER_EMAIL }}" || echo "Superuser already exists or failed to create."
