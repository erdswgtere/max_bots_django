services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - max_network
    command: >
      postgres -c listen_addresses='0.0.0.0' -c max_connections=100
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - max_network
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build:
      context: .
      target: production
    command: >
      sh -c "sleep 10 &&
             cd max_project &&
             python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn max_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./max_project:/app/max_project
      - static_volume:/app/max_project/staticfiles
      - media_volume:/app/max_project/media
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - max_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: .
      target: production
    command: >
      sh -c "cd max_project &&
             celery -A max_project worker -l info --concurrency=8 -Q default,maintenance"
    volumes:
      - ./max_project:/app/max_project
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - max_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      target: production
    command: >
      sh -c "cd max_project &&
             celery -A max_project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - ./max_project:/app/max_project
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - max_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # Flower - Celery Monitoring (Optional)
  flower:
    build:
      context: .
      target: production
    command: >
      sh -c "cd max_project &&
             celery -A max_project flower --port=5555"
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - celery_worker
    networks:
      - max_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - max_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:


networks:
  max_network:
    driver: bridge
